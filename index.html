<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Nhật Khảo Đạo Công</title>
  <meta name="description" content="Phiếu nhật khảo 10 mục đối chiếu công pháp Đạo gia với cổ tịch." />
  <meta name="theme-color" content="#2f4a43" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Noto+Serif:ital,wght@0,400;0,600;1,400&family=Noto+Serif+SC:wght@500;600&family=Source+Sans+3:ital,wght@0,400;0,500;0,600;1,400&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg: #f3eee4;
      --surface: #faf6ee;
      --ink: #1c1915;
      --muted: #6b645a;
      --subtle: #8a8276;
      --line: #d8d0c2;
      --pine: #2f4a43;
      --pine-fg: #f4efe4;
      --warn: #8a3d32;
      --font-display: "Noto Serif", "Noto Serif SC", serif;
      --font-sans: "Source Sans 3", system-ui, sans-serif;
      --font-han: "Noto Serif SC", "Noto Serif", serif;
      --radius: 14px;
    }
    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      padding: 0;
      background: var(--bg);
      color: var(--ink);
      font-family: var(--font-sans);
      min-height: 100dvh;
      line-height: 1.5;
    }
    button, [role="button"] { cursor: pointer; }
    a { color: inherit; text-decoration: none; }
    .wrap {
      max-width: 720px;
      margin: 0 auto;
      padding: 1.25rem 1rem 4rem;
    }
    header {
      display: flex;
      align-items: flex-end;
      justify-content: space-between;
      gap: 1rem;
      border-bottom: 1px solid var(--line);
      padding-bottom: 1rem;
      margin-bottom: 1.25rem;
      flex-wrap: wrap;
    }
    .brand-han {
      font-family: var(--font-han);
      font-size: 0.875rem;
      letter-spacing: 0.2em;
      color: var(--pine);
      margin: 0;
    }
    h1 {
      font-family: var(--font-display);
      font-size: 1.5rem;
      font-weight: 600;
      margin: 0.15rem 0 0;
      letter-spacing: -0.02em;
    }
    nav {
      display: flex;
      flex-wrap: wrap;
      gap: 0.75rem 1rem;
      font-size: 0.9rem;
      font-weight: 500;
      color: var(--muted);
    }
    nav a.active { color: var(--pine); }
    nav a:hover { color: var(--ink); }
    .card {
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: var(--radius);
      padding: 1.1rem 1.15rem;
      margin-bottom: 0.9rem;
    }
    .card h2, .card h3 {
      font-family: var(--font-display);
      margin: 0.2rem 0 0.4rem;
    }
    .muted { color: var(--muted); }
    .subtle { color: var(--subtle); font-size: 0.8rem; }
    .pine { color: var(--pine); }
    .warn { color: var(--warn); }
    .han {
      font-family: var(--font-han);
      color: var(--pine);
      line-height: 1.55;
    }
    .grid-3 {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 0.75rem;
      margin-top: 1rem;
    }
    @media (min-width: 560px) {
      .grid-3 { grid-template-columns: 1fr 1fr 1fr; }
    }
    label.field { display: block; font-size: 0.9rem; }
    label.field span {
      display: block;
      font-size: 0.75rem;
      color: var(--subtle);
      margin-bottom: 0.3rem;
    }
    input, textarea {
      width: 100%;
      border: 1px solid var(--line);
      background: var(--bg);
      color: var(--ink);
      border-radius: 8px;
      padding: 0.6rem 0.75rem;
      font: inherit;
      outline: none;
    }
    input:focus, textarea:focus {
      border-color: color-mix(in oklab, var(--pine) 45%, var(--line));
      box-shadow: 0 0 0 3px color-mix(in oklab, var(--pine) 18%, transparent);
    }
    textarea { resize: vertical; min-height: 4.5rem; }
    .stat-box {
      border: 1px solid var(--line);
      background: var(--bg);
      border-radius: 8px;
      padding: 0.55rem 0.75rem;
    }
    .stat-box strong {
      font-family: var(--font-display);
      font-size: 1.5rem;
      color: var(--pine);
      font-variant-numeric: tabular-nums;
    }
    .pills {
      display: flex;
      flex-wrap: wrap;
      gap: 0.4rem;
    }
    .pill {
      min-height: 2.5rem;
      border: 1px solid var(--line);
      background: var(--surface);
      color: var(--muted);
      border-radius: 999px;
      padding: 0.35rem 0.75rem;
      font-size: 0.875rem;
      font-weight: 500;
    }
    .pill.active {
      background: var(--pine);
      border-color: var(--pine);
      color: var(--pine-fg);
    }
    .pill.active.warn-pill {
      background: var(--warn);
      border-color: var(--warn);
    }
    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-height: 2.75rem;
      border: none;
      border-radius: 8px;
      padding: 0.6rem 1.1rem;
      font: inherit;
      font-weight: 500;
    }
    .btn-primary {
      width: 100%;
      background: var(--pine);
      color: var(--pine-fg);
      margin-top: 0.5rem;
    }
    .btn-primary:hover { opacity: 0.92; }
    .btn-danger {
      border: 1px solid color-mix(in oklab, var(--warn) 40%, var(--line));
      background: transparent;
      color: var(--warn);
      font-size: 0.875rem;
    }
    .meta-row {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 0.75rem;
    }
    ul.hint {
      margin: 0.4rem 0 0.8rem;
      padding: 0;
      list-style: none;
      font-size: 0.875rem;
      color: var(--muted);
    }
    ul.hint li {
      display: flex;
      gap: 0.5rem;
      margin-bottom: 0.2rem;
    }
    ul.hint li::before {
      content: "";
      width: 4px;
      height: 4px;
      border-radius: 50%;
      background: color-mix(in oklab, var(--pine) 50%, transparent);
      margin-top: 0.55rem;
      flex-shrink: 0;
    }
    .warn-box {
      border-left: 2px solid color-mix(in oklab, var(--warn) 45%, transparent);
      padding-left: 0.75rem;
      font-size: 0.875rem;
      color: var(--warn);
      margin: 0.5rem 0 0.9rem;
    }
    .list-link {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 0.75rem;
      padding: 0.85rem 1rem;
      border: 1px solid var(--line);
      background: var(--surface);
      border-radius: 10px;
      margin-bottom: 0.5rem;
    }
    .list-link:hover { border-color: color-mix(in oklab, var(--pine) 40%, var(--line)); }
    .bars { display: flex; align-items: flex-end; gap: 3px; height: 7rem; margin-top: 0.75rem; }
    .bar {
      flex: 1;
      background: var(--pine);
      border-radius: 2px 2px 0 0;
      min-height: 6px;
    }
    .progress {
      height: 6px;
      background: var(--line);
      border-radius: 999px;
      overflow: hidden;
      margin-bottom: 0.65rem;
    }
    .progress > i {
      display: block;
      height: 100%;
      background: var(--pine);
    }
    .empty {
      text-align: center;
      padding: 3rem 1rem;
      border: 1px dashed var(--line);
      border-radius: var(--radius);
      background: var(--surface);
    }
    .hidden { display: none !important; }
    blockquote {
      margin: 0.5rem 0;
      font-family: var(--font-han);
      color: var(--pine);
      font-size: 0.95rem;
    }
  </style>
</head>
<body>
  <div class="wrap">
    <header>
      <a href="#/" data-nav>
        <p class="brand-han">日考道功</p>
        <h1>Nhật Khảo Đạo Công</h1>
      </a>
      <nav>
        <a href="#/" data-nav data-route="/">Phiếu mới</a>
        <a href="#/lich-su" data-nav data-route="/lich-su">Lịch sử</a>
        <a href="#/xu-huong" data-nav data-route="/xu-huong">Xu hướng</a>
        <a href="#/can-cu" data-nav data-route="/can-cu">Căn cứ</a>
      </nav>
    </header>
    <main id="app"></main>
  </div>

  <script>
(function () {
  const KEY = "daogong-nhatkhao-v1";
  const SCORE_LABELS = { 0: "Chưa rõ", 1: "Lệch", 2: "Sơ khởi", 3: "Khớp", 4: "Vững" };

  const CRITERIA = [
    {
      id: "nguon-khi", so: 1, ten: "Nguồn khí Cam Lộ",
      hoi: "Khí mát từ trong đỉnh sinh rồi xuống, hay như bị rót từ ngoài vào?",
      goiY: ["Từ trong mở ra, thấm mát rồi giáng", "Không phân biệt được", "Cảm như ánh sáng / khí từ ngoài đỉnh tràn vào"],
      han: "自內而開出者真，自外而開入者幻。",
      dich: "Từ trong mở ra thì chân; từ ngoài mở vào thì ảo.",
      nguon: "Mẫn Nhất Đắc · Quan Khiếu Yếu Chỉ",
      canhBao: "Nếu khí luôn như bị rót từ ngoài: ghi lệch, đừng cưỡng mở thêm."
    },
    {
      id: "thien-mon", so: 2, ten: "Thiên Môn / Bách Hội",
      hoi: "Đỉnh đầu mát, thông, không căng nóng?",
      goiY: ["Mát, thấm, nhẹ", "Có lúc mát có lúc căng", "Nóng, căng, nhức kéo dài"],
      han: "頂則露灑崑崙……甘霖霈灑，流池若注，味香而甜。",
      dich: "Đỉnh thì sương rưới Côn Lôn… cam lâm đổ như rót, vị thơm mà ngọt.",
      nguon: "Mẫn Nhất Đắc · Quan Khiếu Yếu Chỉ",
      canhBao: "Nóng căng kéo dài là tiến hỏa lệch, không phải Cam Lộ."
    },
    {
      id: "ne-hoan", so: 3, ten: "Nê Hoàn hư linh",
      hoi: "Bên trong đầu có cảm giác rỗng, thần sáng, không hôn trầm?",
      goiY: ["Rỗng mà tỉnh", "Rỗng xen mơ màng", "Nặng đầu, hôn trầm, choáng"],
      han: "天谷元神，守之自真。天谷者，泥丸宮也……空洞之界也。",
      dich: "Thiên Cốc nguyên thần, giữ thì tự chân. Thiên Cốc tức Nê Hoàn… cõi trống rỗng.",
      nguon: "Chú Đạo Đức / Linh Khu",
      canhBao: "Rỗng mà hôn mê khác với hư linh. Hư linh phải tỉnh."
    },
    {
      id: "luc-can", so: 4, ten: "Lục căn + Mắt 3",
      hoi: "Mắt tai mũi lưỡi xúc ý / Mắt 3 mở nhưng không bị quang–thanh kéo tán?",
      goiY: ["Mở mà thu, không đuổi cảnh", "Mở rồi bị quang/tiếng kéo", "Bế hoặc loạn"],
      han: "一面之神宗泥丸。一根既返本，六根成解脫。",
      dich: "Các thần của mặt tôn Nê Hoàn làm tông. Một căn về gốc thì sáu căn giải thoát.",
      nguon: "Hoàng Đình Nội Cảnh · Tịnh Hư Tử",
      canhBao: "Khai căn rồi đuổi theo ảo quang là tán thần, không phải giải thoát."
    },
    {
      id: "tam-truc", so: 5, ten: "Ba trục Nhâm–Đốc",
      hoi: "Đại Chùy–Thiên Đột, Đản Trung–Linh Đài, Thần Khuyết–Mệnh Môn có thông, không kẹt?",
      goiY: ["Ba tầng trước–sau đều thông", "Một–hai cặp thông", "Kẹt cổ / ngực / lưng"],
      han: "膻中者，為氣之海。丹田有三：上田神舍，中田氣府，下田精區。",
      dich: "Đản Trung là biển khí. Ba đan điền: thượng nhà thần, trung phủ khí, hạ khu tinh.",
      nguon: "Linh Khu · Hải Luận / Chung Lã Truyền Đạo Tập",
      canhBao: "Thông một tầng trên mà kẹt dưới là khí phù."
    },
    {
      id: "tu-chi", so: 6, ten: "Lao Cung & Dũng Tuyền",
      hoi: "Khí ra được hai lòng bàn tay–chân, và thu về được không?",
      goiY: ["Ra rồi thu về đan điền", "Ra mạnh, thu yếu", "Chỉ xì ra, không về"],
      han: "上通泥丸，下透湧泉。真人之息以踵。",
      dich: "Trên thông Nê Hoàn, dưới thấu Dũng Tuyền. Chân nhân thở đến gót.",
      nguon: "Bát Mạch Kinh / Trang Tử",
      canhBao: "Chỉ ra không thu = khí tiết, không phải công thành."
    },
    {
      id: "mao-khieu", so: 7, ten: "Mao khiếu / lớp da",
      hoi: "Toàn thân lỗ lông / bề mặt da có khí, như sâu bò, mát lan?",
      goiY: ["Lan đều rồi thu", "Lan mạnh ở da, trong rỗng", "Không có / chỉ nóng rát"],
      han: "八萬四千毫竅、三百六十骨節一齊爆開。一竅開百竅齊開。",
      dich: "Tám vạn bốn nghìn lỗ lông, ba trăm sáu mươi đốt xương cùng mở. Một khiếu mở thì trăm khiếu mở.",
      nguon: "Mẫn Nhất Đắc · Quan Khiếu Yếu Chỉ",
      canhBao: "Khí chỉ ở da mà bụng rỗng là tán, chưa quy căn."
    },
    {
      id: "ha-dan", so: 8, ten: "Quy căn Hạ Đan",
      hoi: "Sau khi khí lên đỉnh / ra da, bụng dưới ấm, có chỗ về?",
      goiY: ["Hạ đan ấm, vững, khí có nhà", "Ấm lúc được lúc mất", "Đầu đầy, bụng rỗng"],
      han: "自上田復下田。化為甘露，降下重樓，復歸坤位。",
      dich: "Từ thượng điền trở lại hạ điền. Hóa Cam Lộ, xuống Trùng Lâu, về vị Khôn.",
      nguon: "Chung Lã / Tính Mệnh Khuê Chỉ",
      canhBao: "Đây là tiêu chí then chốt giai đoạn của bạn. Không về hạ đan thì chưa hoàn lộ."
    },
    {
      id: "dia-ho", so: 9, ten: "Địa Hộ bế",
      hoi: "Gốc dưới kín: không tiết tinh, không khí hạ trệ, không mất gốc?",
      goiY: ["Kín, an, khí không lậu", "Hơi không vững", "Tiết, nóng hạ tiêu, mất gốc"],
      han: "天門常開，地戶永閉。閉塞命門保玉都。",
      dich: "Thiên Môn thường mở, Địa Hộ mãi đóng. Đóng kín Mệnh Môn, giữ Ngọc Đô.",
      nguon: "Bát Mạch Kinh / Hoàng Đình",
      canhBao: "Đỉnh mở mà địa hộ không bế là lệch mệnh công."
    },
    {
      id: "vo-vi", so: 10, ten: "Hữu vi / vô vi",
      hoi: "Buổi này có cưỡng ý dẫn khí, đuổi cảnh, tiến hỏa không?",
      goiY: ["Quên rồi lại quên, khí tự vận", "Có dẫn nhẹ rồi buông", "Cưỡng dẫn, đuổi quang, thổi hỏa"],
      han: "自有天然真火候，不須柴炭及吹噓。忘而又忘，玄關斯闢。",
      dich: "Sẵn hỏa hầu trời sinh, không cần củi than và thổi. Quên rồi lại quên, Huyền Quan mới mở.",
      nguon: "Ngộ Chân Thiên / Quan Khiếu Yếu Chỉ",
      canhBao: "Giai đoạn Cam Lộ: cổ tịch bảo thoái phù, đừng tiến hỏa."
    }
  ];

  const TRONG_TAM = ["ha-dan", "dia-ho", "vo-vi", "nguon-khi"];

  const GIAI_DOAN = [
    { han: "鍊形成氣，鍊氣成神，鍊神合道。", dich: "Luyện hình thành khí, luyện khí thành thần, luyện thần hợp đạo.", nguon: "Chung Lã Truyền Đạo Tập" },
    { han: "自下田入上田，自上田復下田。", dich: "Từ hạ điền vào thượng điền, từ thượng điền trở lại hạ điền.", nguon: "Chung Lã · Luận hoàn đan" },
    { han: "醍醐灌頂，甘露灑心。此乃真景象也，非譬喻也。", dich: "Đề hồ quán đỉnh, Cam Lộ rưới tâm. Đây là cảnh thật, không phải thí dụ.", nguon: "Tính Mệnh Khuê Chỉ" },
    { han: "咽津納氣是人行……鼎內若無真種子，猶將水火煮空鐺。", dich: "Nuốt tân nạp khí là việc người thường. Đỉnh không hạt giống thật khác gì đun chảo không.", nguon: "Ngộ Chân Thiên" }
  ];

  function loadSessions() {
    try {
      const raw = localStorage.getItem(KEY);
      if (!raw) return [];
      const parsed = JSON.parse(raw);
      return Array.isArray(parsed) ? parsed.sort((a, b) => b.createdAt.localeCompare(a.createdAt)) : [];
    } catch { return []; }
  }
  function saveSessions(list) {
    localStorage.setItem(KEY, JSON.stringify(list));
  }
  function upsertSession(s) {
    const all = loadSessions().filter((x) => x.id !== s.id);
    all.unshift(s);
    saveSessions(all);
  }
  function deleteSession(id) {
    saveSessions(loadSessions().filter((x) => x.id !== id));
  }
  function mean(vals) {
    const n = vals.filter((v) => v > 0).length;
    if (!n) return 0;
    return vals.reduce((a, b) => a + b, 0) / n;
  }
  function quyCan(s) {
    return mean(TRONG_TAM.map((id) => s.scores[id] || 0));
  }
  function average(s) {
    return mean(CRITERIA.map((c) => s.scores[c.id] || 0));
  }
  function uid() {
    return Date.now().toString(36) + "-" + Math.random().toString(36).slice(2, 8);
  }
  function today() {
    return new Date().toISOString().slice(0, 10);
  }
  function emptyScores() {
    const o = {};
    CRITERIA.forEach((c) => { o[c.id] = 0; });
    return o;
  }
  function emptyNotes() {
    const o = {};
    CRITERIA.forEach((c) => { o[c.id] = ""; });
    return o;
  }
  function escapeHtml(str) {
    return String(str || "")
      .replace(/&/g, "&amp;")
      .replace(/</g, "&lt;")
      .replace(/>/g, "&gt;")
      .replace(/"/g, "&quot;");
  }

  // ---- draft state for form ----
  let draft = {
    id: uid(),
    createdAt: "",
    date: today(),
    durationMin: 30,
    scores: emptyScores(),
    notes: emptyNotes(),
    tong: ""
  };

  function route() {
    const hash = location.hash.replace(/^#/, "") || "/";
    const parts = hash.split("/").filter(Boolean);
    if (!parts.length) return { name: "home" };
    if (parts[0] === "lich-su") return { name: "history" };
    if (parts[0] === "xu-huong") return { name: "trends" };
    if (parts[0] === "can-cu") return { name: "canon" };
    if (parts[0] === "phien" && parts[1]) return { name: "detail", id: parts[1] };
    return { name: "home" };
  }

  function setNavActive() {
    const r = route();
    document.querySelectorAll("nav a").forEach((a) => {
      const path = a.getAttribute("data-route");
      let on = false;
      if (path === "/" && r.name === "home") on = true;
      if (path === "/lich-su" && (r.name === "history" || r.name === "detail")) on = true;
      if (path === "/xu-huong" && r.name === "trends") on = true;
      if (path === "/can-cu" && r.name === "canon") on = true;
      a.classList.toggle("active", on);
    });
  }

  function renderHome() {
    const qc = quyCan(draft).toFixed(1);
    const cards = CRITERIA.map((item) => {
      const score = draft.scores[item.id] || 0;
      const trong = TRONG_TAM.includes(item.id);
      const pills = [0, 1, 2, 3, 4].map((s) =>
        `<button type="button" class="pill ${score === s ? "active" : ""} ${score === s && s === 1 ? "warn-pill" : ""}" data-score-id="${item.id}" data-score="${s}">${SCORE_LABELS[s]}</button>`
      ).join("");
      return `
        <article class="card" data-crit="${item.id}">
          <div class="meta-row">
            <div>
              <p class="subtle">Mục ${item.so}${trong ? " · then chốt giai đoạn này" : ""}</p>
              <h3>${escapeHtml(item.ten)}</h3>
            </div>
            <span class="han">${String(item.so).padStart(2, "0")}</span>
          </div>
          <p>${escapeHtml(item.hoi)}</p>
          <ul class="hint">${item.goiY.map((g) => `<li>${escapeHtml(g)}</li>`).join("")}</ul>
          <blockquote class="han">${escapeHtml(item.han)}</blockquote>
          <p class="muted" style="font-size:0.9rem;font-style:italic">${escapeHtml(item.dich)}</p>
          <p class="subtle">${escapeHtml(item.nguon)}</p>
          <p class="warn-box">${escapeHtml(item.canhBao)}</p>
          <div class="pills">${pills}</div>
          <label class="field" style="margin-top:0.85rem">
            <span>Ghi chú buổi này</span>
            <textarea data-note-id="${item.id}" rows="2" placeholder="Cảm thọ cụ thể, không diễn giải…">${escapeHtml(draft.notes[item.id] || "")}</textarea>
          </label>
        </article>`;
    }).join("");

    return `
      <section class="card">
        <p class="han" style="font-size:0.9rem">每坐一考 · mỗi ngồi một khảo</p>
        <h2>Phiếu nhật khảo</h2>
        <p class="muted" style="font-size:0.9rem">Chấm ngay sau khi xuống tọa. Cảnh khớp cổ tịch không đồng nghĩa đã kết đan. Bốn mục then chốt giai đoạn Cam Lộ: nguồn khí, quy hạ đan, địa hộ, vô vi.</p>
        <div class="grid-3">
          <label class="field">
            <span>Ngày</span>
            <input type="date" id="f-date" value="${escapeHtml(draft.date)}" />
          </label>
          <label class="field">
            <span>Thời lượng (phút)</span>
            <input type="number" id="f-dur" min="1" max="300" value="${draft.durationMin}" />
          </label>
          <div class="stat-box">
            <p class="subtle">Chỉ số quy căn</p>
            <strong id="qc-val">${qc}</strong>
            <p class="subtle">Trung bình 4 mục then chốt</p>
          </div>
        </div>
      </section>
      ${cards}
      <label class="field" style="margin:0.5rem 0 0.75rem">
        <span style="color:var(--ink);font-size:0.9rem;font-weight:500">Tổng cảm buổi ngồi</span>
        <textarea id="f-tong" rows="4" placeholder="Một đoạn ngắn: khí từ đâu, về đâu, có cưỡng ý không.">${escapeHtml(draft.tong)}</textarea>
      </label>
      <button type="button" class="btn btn-primary" id="btn-save">Lưu phiếu này</button>
    `;
  }

  function renderHistory() {
    const sessions = loadSessions();
    if (!sessions.length) {
      return `
        <div class="empty">
          <p style="font-family:var(--font-display);font-size:1.1rem;margin:0">Chưa có phiếu nào</p>
          <p class="muted" style="font-size:0.9rem">Sau buổi ngồi, vào Phiếu mới và chấm 10 mục.</p>
          <p style="margin-top:1.25rem"><a class="btn btn-primary" style="width:auto;display:inline-flex;padding:0.6rem 1.25rem" href="#/" data-nav>Mở phiếu mới</a></p>
        </div>`;
    }
    return `
      <h2 style="font-family:var(--font-display);font-size:1.25rem;margin:0 0 0.75rem">Lịch sử ngồi</h2>
      ${sessions.map((s) => {
        const qc = quyCan(s).toFixed(1);
        const avg = average(s).toFixed(1);
        const ha = SCORE_LABELS[s.scores["ha-dan"] || 0];
        return `
          <a class="list-link" href="#/phien/${encodeURIComponent(s.id)}" data-nav>
            <div>
              <p style="margin:0;font-weight:500;font-variant-numeric:tabular-nums">${escapeHtml(s.date)}</p>
              <p class="muted" style="margin:0.15rem 0 0;font-size:0.875rem">${s.durationMin} phút · hạ đan ${ha}</p>
            </div>
            <div style="text-align:right">
              <p class="subtle" style="margin:0">Quy căn</p>
              <p class="pine" style="margin:0;font-family:var(--font-display);font-size:1.25rem;font-variant-numeric:tabular-nums">${qc}</p>
              <p class="muted" style="margin:0;font-size:0.75rem">TB ${avg}</p>
            </div>
          </a>`;
      }).join("")}`;
  }

  function renderDetail(id) {
    const s = loadSessions().find((x) => x.id === id);
    if (!s) {
      return `<p class="muted">Không tìm thấy phiếu. <a href="#/lich-su" class="pine" data-nav style="text-decoration:underline">Về lịch sử</a></p>`;
    }
    return `
      <div class="meta-row" style="margin-bottom:1rem">
        <div>
          <p class="muted" style="margin:0;font-variant-numeric:tabular-nums">${escapeHtml(s.date)}</p>
          <h2 style="font-family:var(--font-display);font-size:1.25rem;margin:0.2rem 0">Phiếu ${s.durationMin} phút</h2>
          <p class="pine" style="margin:0;font-size:0.9rem">Chỉ số quy căn ${quyCan(s).toFixed(1)} / 4</p>
        </div>
        <button type="button" class="btn btn-danger" id="btn-del" data-id="${escapeHtml(s.id)}">Xóa</button>
      </div>
      ${s.tong ? `<p class="card" style="font-size:0.9rem">${escapeHtml(s.tong)}</p>` : ""}
      <ol style="list-style:none;padding:0;margin:0">
        ${CRITERIA.map((c) => `
          <li class="card">
            <div class="meta-row">
              <h3 style="font-size:1rem;margin:0">${c.so}. ${escapeHtml(c.ten)}</h3>
              <span class="pine" style="font-size:0.9rem">${SCORE_LABELS[s.scores[c.id] || 0]}</span>
            </div>
            ${s.notes[c.id] ? `<p class="muted" style="margin:0.5rem 0 0;font-size:0.875rem">${escapeHtml(s.notes[c.id])}</p>` : ""}
          </li>`).join("")}
      </ol>`;
  }

  function renderTrends() {
    const sessions = loadSessions().slice().reverse();
    if (!sessions.length) {
      return `<p class="muted">Cần ít nhất một phiếu đã lưu.</p>`;
    }
    const latest = sessions[sessions.length - 1];
    const avgBy = (id) => {
      const vals = sessions.map((s) => s.scores[id] || 0).filter((v) => v > 0);
      if (!vals.length) return 0;
      return vals.reduce((a, b) => a + b, 0) / vals.length;
    };
    return `
      <header style="margin-bottom:1rem">
        <h2 style="font-family:var(--font-display);font-size:1.25rem;margin:0">Xu hướng</h2>
        <p class="muted" style="margin:0.35rem 0 0;font-size:0.9rem">${sessions.length} buổi. Cổ tịch xem bốn cột then chốt hơn quang cảm.</p>
      </header>
      <section class="card">
        <p class="subtle" style="margin:0">Quy căn theo thời gian</p>
        <div class="bars">
          ${sessions.map((s) => {
            const v = quyCan(s);
            const h = Math.max(6, (v / 4) * 100);
            return `<div class="bar" style="height:${h}%" title="${escapeHtml(s.date)}: ${v.toFixed(1)}"></div>`;
          }).join("")}
        </div>
        <p class="muted" style="margin:0.6rem 0 0;font-size:0.875rem">Phiếu mới nhất: ${quyCan(latest).toFixed(1)} / 4</p>
      </section>
      <section style="margin-top:1.25rem">
        <h3 style="font-size:1rem;margin:0 0 0.75rem">Trung bình từng mục</h3>
        ${CRITERIA.map((c) => {
          const a = avgBy(c.id);
          return `
            <div>
              <div style="display:flex;justify-content:space-between;font-size:0.875rem;margin-bottom:0.25rem">
                <span>${escapeHtml(c.ten)}</span>
                <span class="muted" style="font-variant-numeric:tabular-nums">${a.toFixed(1)}</span>
              </div>
              <div class="progress"><i style="width:${(a / 4) * 100}%"></i></div>
            </div>`;
        }).join("")}
      </section>`;
  }

  function renderCanon() {
    return `
      <header style="margin-bottom:1.25rem">
        <h2 style="font-family:var(--font-display);font-size:1.25rem;margin:0">Căn cứ cổ tịch</h2>
        <p class="muted" style="margin:0.4rem 0 0;font-size:0.9rem;max-width:40rem">Mười mục nhật khảo bám nguyên văn. Dùng để đối chiếu công pháp, không dùng để tự phong quả vị. Cảnh (hiện tượng) khác chứng (đan kết).</p>
      </header>
      <h3 style="font-size:1rem;margin:0 0 0.6rem">Định vị giai đoạn</h3>
      ${GIAI_DOAN.map((g) => `
        <blockquote class="card">
          <p class="han" style="margin:0">${escapeHtml(g.han)}</p>
          <p class="muted" style="margin:0.5rem 0 0;font-size:0.875rem;font-style:italic">${escapeHtml(g.dich)}</p>
          <p class="subtle" style="margin:0.35rem 0 0">${escapeHtml(g.nguon)}</p>
        </blockquote>`).join("")}
      <h3 style="font-size:1rem;margin:1.25rem 0 0.6rem">Mười mục và câu chữ</h3>
      ${CRITERIA.map((c) => `
        <article class="card">
          <p class="subtle" style="margin:0">Mục ${c.so}</p>
          <h3 style="font-family:var(--font-display);font-size:1.1rem;margin:0.2rem 0">${escapeHtml(c.ten)}</h3>
          <p style="margin:0.35rem 0;font-size:0.9rem">${escapeHtml(c.hoi)}</p>
          <p class="han" style="margin:0.6rem 0 0.25rem">${escapeHtml(c.han)}</p>
          <p class="muted" style="margin:0;font-size:0.875rem;font-style:italic">${escapeHtml(c.dich)}</p>
          <p class="subtle" style="margin:0.35rem 0 0">${escapeHtml(c.nguon)}</p>
          <p class="warn" style="margin:0.6rem 0 0;font-size:0.875rem">${escapeHtml(c.canhBao)}</p>
        </article>`).join("")}`;
  }

  function bindHome() {
    const app = document.getElementById("app");
    app.querySelectorAll("[data-score-id]").forEach((btn) => {
      btn.addEventListener("click", () => {
        const id = btn.getAttribute("data-score-id");
        const s = Number(btn.getAttribute("data-score"));
        draft.scores[id] = s;
        const parent = btn.parentElement;
        parent.querySelectorAll(".pill").forEach((p) => {
          const ps = Number(p.getAttribute("data-score"));
          p.classList.toggle("active", ps === s);
          p.classList.toggle("warn-pill", ps === s && s === 1);
        });
        const qc = document.getElementById("qc-val");
        if (qc) qc.textContent = quyCan(draft).toFixed(1);
      });
    });
    app.querySelectorAll("[data-note-id]").forEach((ta) => {
      ta.addEventListener("input", () => {
        draft.notes[ta.getAttribute("data-note-id")] = ta.value;
      });
    });
    const date = document.getElementById("f-date");
    const dur = document.getElementById("f-dur");
    const tong = document.getElementById("f-tong");
    if (date) date.addEventListener("change", () => { draft.date = date.value; });
    if (dur) dur.addEventListener("change", () => { draft.durationMin = Number(dur.value) || 0; });
    if (tong) tong.addEventListener("input", () => { draft.tong = tong.value; });
    const save = document.getElementById("btn-save");
    if (save) {
      save.addEventListener("click", () => {
        const now = new Date();
        upsertSession({
          ...draft,
          id: draft.id || uid(),
          createdAt: now.toISOString(),
          date: draft.date || today(),
          scores: { ...draft.scores },
          notes: { ...draft.notes }
        });
        // reset draft for next session
        draft = {
          id: uid(),
          createdAt: "",
          date: today(),
          durationMin: 30,
          scores: emptyScores(),
          notes: emptyNotes(),
          tong: ""
        };
        location.hash = "#/lich-su";
      });
    }
  }

  function bindDetail() {
    const btn = document.getElementById("btn-del");
    if (!btn) return;
    btn.addEventListener("click", () => {
      if (confirm("Xóa phiếu này?")) {
        deleteSession(btn.getAttribute("data-id"));
        location.hash = "#/lich-su";
      }
    });
  }

  function render() {
    const r = route();
    setNavActive();
    const app = document.getElementById("app");
    if (r.name === "home") {
      app.innerHTML = renderHome();
      bindHome();
    } else if (r.name === "history") {
      app.innerHTML = renderHistory();
    } else if (r.name === "detail") {
      app.innerHTML = renderDetail(r.id);
      bindDetail();
    } else if (r.name === "trends") {
      app.innerHTML = renderTrends();
    } else if (r.name === "canon") {
      app.innerHTML = renderCanon();
    }
    window.scrollTo(0, 0);
  }

  window.addEventListener("hashchange", render);
  render();
})();
  </script>
</body>
</html>
